<?xml version="1.0" encoding="UTF-8"?>
<!-- 普通公交站点：白底空心圈 + 线网同色（青绿 #2f6f73）描边，外圈白色光晕保证深色底上可辨。
     与客流分析各模块（断面站点圈/换乘站点圈/可达性圆点）同一视觉语言。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <circle cx="48" cy="48" r="40" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="48" cy="48" r="31" fill="#ffffff" stroke="#2f6f73" stroke-width="10"/>
</svg>
