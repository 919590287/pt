<?xml version="1.0" encoding="UTF-8"?>
<!-- 关联线路模式换乘站点图标：蓝色徽章 + 白色双向换乘箭头。
     外圈同色低透明焦点环 + 白色光晕，与选中站点高亮图标同一构图层次；
     徽章蓝取关联线路蓝（#1569de）到加深蓝（#0d3f85）的纵向渐变，与蓝色关联线同族。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="transfer-badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1569de"/>
      <stop offset="1" stop-color="#0d3f85"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="43" fill="none" stroke="#1569de" stroke-opacity="0.2" stroke-width="7"/>
  <circle cx="48" cy="48" r="40" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="48" cy="48" r="35" fill="#ffffff"/>
  <circle cx="48" cy="48" r="35" fill="none" stroke="#0d3f85" stroke-opacity="0.28" stroke-width="1.5"/>
  <circle cx="48" cy="48" r="30" fill="url(#transfer-badge)"/>
  <path d="M31 40 H55" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M53 30.5 L67 40 L53 49.5 Z" fill="#ffffff"/>
  <path d="M65 56 H41" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M43 46.5 L29 56 L43 65.5 Z" fill="#ffffff"/>
</svg>
