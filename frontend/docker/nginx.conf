# 前端容器的 Nginx：既托管 Vite 产物，也反代后端接口。
# 整套系统对外只暴露这一个 80 端口，后端不直接见光。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 数据管理页支持上传 shp/zip，后端 multipart 上限 200MB，这里留出余量
    client_max_body_size 300m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/octet-stream image/svg+xml;

    # ---------------------------------------------------------------------
    # 后端接口：后端 15 个 Controller 的路径前缀全是 /pt/
    # ---------------------------------------------------------------------
    location /pt/ {
        # Docker 内嵌 DNS。用变量 + resolver 而不是 upstream 块，是为了让 nginx
        # 每 10 秒重新解析一次后端容器地址；否则 backend 容器重建换了 IP 之后，
        # nginx 会一直拿着旧 IP 报 502，直到手动 reload。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_addr "backend:8090";
        proxy_pass http://$backend_addr$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 缓存构建、大模型加载、线网优化都是长任务，
        # 对齐后端 application.yml 的 no-request-timeout: 1800000（30 分钟）。
        # 这里若用默认的 60s，大模型加载到一半会被掐断报 504。
        proxy_connect_timeout 60s;
        proxy_send_timeout   1800s;
        proxy_read_timeout   1800s;

        # 轨迹 .bin 是大二进制流，上传也可能是几百 MB 的 shp，
        # 关掉两端缓冲让数据边收边传，避免先落盘再转发。
        proxy_buffering         off;
        proxy_request_buffering off;
    }

    # ---------------------------------------------------------------------
    # 静态资源缓存策略
    # ---------------------------------------------------------------------

    # Vite 产物带内容 hash，可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 三维建筑瓦片和车辆模型，体积大但更新少
    location /city-buildings/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location /models/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 运行时配置和入口 HTML 绝不能缓存：
    # 否则改了环境变量重启容器，用户浏览器还在用旧的后端地址。
    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }
    location = /map-config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
