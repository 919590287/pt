server:
  compression:
    enabled: true
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain
  port: 8090
  undertow:
    no-request-timeout: 1800000
    # HTTP POST请求最大的大小
    max-http-post-size: 0
    # 每个区分配的buffer数量 , 所以pool的大小是buffer-size * buffers-per-region
    buffer-size: 2048
    # 是否分配的直接内存
    direct-buffers: true
    # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
    threads:
      worker: 512
      io: 32

spring:
  undertow:
    websocket:
      buffer-pool-size: 512

logging:
  level:
    root: info

matsim:
  # 可视化数据目录和拖拽式上传目录合并
  data: "/Volumes/USB DISK/pt_data/"